<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Administrador Nuppy</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#5B351F">
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="a11y.css">
</head>
<body>
  <a class="skip" href="#conteudo">Pular para o conteúdo</a>
  <div class="bg" aria-hidden="true"></div>

  <main id="conteudo" class="wrap">
    <div class="col">
      <a class="home" href="/">&larr; Voltar para a página inicial</a>

      <section id="login" class="box" aria-labelledby="h-login">
        <img class="logo" src="img/logo.png" alt="Nuppy" width="666" height="375">
        <h1 id="h-login">Bem-vindo à Nuppy</h1>
        <p class="sub">Área do administrador</p>

        <!-- ENTRAR -->
        <form id="fl" novalidate>
          <div class="field">
            <label for="email">E-mail</label>
            <div class="in">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              <input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="Digite seu e-mail" required maxlength="160">
            </div>
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <div class="in">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
              <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required maxlength="128">
              <button type="button" class="eye" id="ver" aria-label="Mostrar senha" aria-pressed="false" aria-controls="senha">
                <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
              </button>
            </div>
          </div>

          <div class="row">
            <label class="chk"><input type="checkbox" id="lembrar" name="lembrar"> Lembre-me</label>
            <button type="button" class="link" id="esqueci">Perdeu sua senha?</button>
          </div>

          <button class="go" type="submit" id="entrar">Acessar conta</button>
          <div id="status" role="status" aria-live="polite" tabindex="-1" hidden></div>
        </form>

        <!-- RECUPERAR SENHA -->
        <form id="fr" novalidate hidden>
          <p class="hint">Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link para criar uma nova senha.</p>
          <div class="field">
            <label for="email-rec">E-mail</label>
            <div class="in">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              <input id="email-rec" type="email" inputmode="email" autocomplete="email" placeholder="Digite seu e-mail" required maxlength="160">
            </div>
          </div>
          <button class="go" type="submit" id="enviar-rec">Enviar link</button>
          <div id="status-rec" role="status" aria-live="polite" tabindex="-1" hidden></div>
          <p class="foot"><button type="button" class="link" id="voltar">Voltar ao login</button></p>
        </form>
      </section>
    </div>
  </main>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="admin-core.js"></script>
  <script src="a11y.js" defer></script>
  <script>
  (async () => {
    "use strict";
    const $ = (s) => document.querySelector(s);
    const fl = $("#fl"), fr = $("#fr"), campoSenha = $("#senha"), botao = $("#entrar");
    const EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

    function mostrar(el, texto, classe) {
      el.hidden = false; el.className = "msg " + classe; el.textContent = texto; el.focus();
    }

    // Olho: mostrar / ocultar senha
    $("#ver").addEventListener("click", (e) => {
      const b = e.currentTarget, visivel = campoSenha.type === "text";
      campoSenha.type = visivel ? "password" : "text";
      b.setAttribute("aria-pressed", String(!visivel));
      b.setAttribute("aria-label", visivel ? "Mostrar senha" : "Ocultar senha");
    });

    // Alterna entre login e recuperação de senha
    function trocar(recuperar) {
      fl.hidden = recuperar; fr.hidden = !recuperar;
      $("#h-login").textContent = recuperar ? "Recuperar senha" : "Bem-vindo à Nuppy";
      (recuperar ? $("#email-rec") : $("#email")).focus();
    }
    $("#esqueci").addEventListener("click", () => { $("#email-rec").value = fl.email.value; trocar(true); });
    $("#voltar").addEventListener("click", () => trocar(false));

    $("#lembrar").checked = Nuppy.lembrando();

    // Já existe sessão de administrador? Vai direto ao painel
    if (Nuppy.configurado && (await Nuppy.sessaoAdmin())) { location.replace("/admin"); return; }

    // ENTRAR
    fl.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (botao.disabled) return;
      const status = $("#status"); status.hidden = true;

      const email = fl.email.value.trim(), senha = fl.senha.value;
      if (!EMAIL.test(email)) { mostrar(status, "Informe um e-mail válido.", "bad"); fl.email.focus(); return; }
      if (!senha) { mostrar(status, "Informe a senha.", "bad"); fl.senha.focus(); return; }
      if (!Nuppy.configurado) { mostrar(status, "O login ainda não está configurado (preencha o supabase-config.js).", "bad"); return; }

      botao.disabled = true; botao.textContent = "Entrando…";
      try {
        Nuppy.definirLembrar($("#lembrar").checked);
        const { data, error } = await Nuppy.db.auth.signInWithPassword({ email, password: senha });
        if (error || !data.user) { mostrar(status, "E-mail ou senha incorretos.", "bad"); return; }

        // Só segue quem está cadastrado na tabela de administradores
        if (!(await Nuppy.ehAdmin(data.user.id))) {
          await Nuppy.db.auth.signOut();
          mostrar(status, "Esta conta não tem acesso ao painel administrador.", "bad");
          return;
        }
        location.replace("/admin");
      } catch (err) {
        mostrar(status, "Não foi possível entrar agora. Tente novamente em instantes.", "bad");
      } finally {
        botao.disabled = false; botao.textContent = "Acessar conta";
        fl.senha.value = "";
      }
    });

    // RECUPERAR SENHA (o e-mail leva à página /redefinir)
    fr.addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = $("#status-rec"), b = $("#enviar-rec"), email = $("#email-rec").value.trim();
      status.hidden = true;
      if (!EMAIL.test(email)) { mostrar(status, "Informe um e-mail válido.", "bad"); $("#email-rec").focus(); return; }
      if (!Nuppy.configurado) { mostrar(status, "O envio ainda não está configurado.", "bad"); return; }
      b.disabled = true; b.textContent = "Enviando…";
      const { error } = await Nuppy.db.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/redefinir" });
      b.disabled = false; b.textContent = "Enviar link";
      // Mesma resposta exista ou não a conta, para não revelar quem é cadastrado
      if (error && error.status === 429) mostrar(status, "Muitas tentativas. Aguarde alguns minutos.", "bad");
      else mostrar(status, "Se este e-mail estiver cadastrado, o link chegará em instantes. Verifique também o spam.", "ok");
    });
  })();
  </script>
</body>
</html>
